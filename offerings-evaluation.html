    <!-- Main content of the page -->
    <main class="member-form-page">

    
        <!-- Page title -->
        <h1 class="member-form-title"> Evaluation of completed activity </h1>

        <!-- Evaluation form -->
        <div class="member-form-container">
            <form action="#" method="post">

                <!-- Choose the completed offering -->
                <div class="form-group"> 
                    <label for="completed-offering"> Choose the requested offering: </label>

                    <select id="completed-offering" name="completed-offering" required >

                        <option value="" disabled selected> Choose the offer you completed </option>
                        <option value="bridal-bouquet-design"> Bridal Bouquet Design </option>
                        <option value="flower-arranging"> Flower Arranging 101 </option>
                        <option value="botanical-photography"> Botanical Photography Workshop </option>
                        <option value="indoor-plant-care"> Indoor Plant Care &amp; Propagation </option>
                        <option value="floral-perfume">  Floral Perfume Preparation </option>
                        <option value="bouquet-styling">  Bouquet Styling </option>

                    </select>
                </div>

                <!-- Rate the offering -->
                <div class="form-group">
                    <label for="rating"> Rate the Offering from 5 to 1:  </label>

                    <select id="rating" name="rating" required>
                        <option value="" disabled selected> Choose your rating </option>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Very Good</option>
                        <option value="3">3 - Good</option>
                        <option value="2">2 - Fair</option>
                        <option value="1">1 - Poor</option>
                    </select>
                </div>

                <!-- Write feedback -->
                <div class="form-group">
                    <label for="feedback">Feedback:</label>
                    <textarea id="feedback" name="feedback" rows="5" placeholder="Write your feedback here..." required></textarea>
                </div>

                <!-- Submit the evaluation -->
                <input type="button" id="evalButton" value="Submit Evaluation" class="member-form-button">

            </form>
          </div>
    </main>
