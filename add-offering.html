<!-- Main content of the page -->
<main class="mgr-page">


    <!-- Page title -->
    <h1 class="mgr-title">Add New Offering</h1>

    <!-- Add offering form (user interface only) -->
    <section class="mgr-box">
        <form action="#" method="post" enctype="multipart/form-data" class="mgr-form">

            <label for="offer-name">Name of Offering:</label>
            <input type="text" id="offer-name" name="offer-name" placeholder="Add text" required>

            <label for="offer-image">Offering Picture (upload file):</label>
            <input type="file" id="offer-image" name="offer-image" accept="image/*" required>

            <label for="offer-price">Price (in Riyals):</label>
            <input type="number" id="offer-price" name="offer-price" min="0" placeholder="0 for a free offering" required>

            <label for="offer-description">Description:</label>
            <textarea id="offer-description" name="offer-description" rows="5" placeholder="Add text" required></textarea>

            <button type="submit" class="mgr-submit">Add Offering</button>
        </form>
    </section>

</main>
